<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening Sites...</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Noto Sans TC', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #e8e8e8;
    }
    
    .container {
      text-align: center;
      padding: 3rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      animation: fadeIn 0.5s ease-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .loader {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #4fd1c5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.5rem;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    h1 {
      font-size: 1.5rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }
    
    p {
      color: #a0a0a0;
      font-size: 0.95rem;
    }
    
    .count {
      color: #4fd1c5;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="loader"></div>
    <h1>正在打開網站...</h1>
    <p>已開啟 <span class="count" id="count">0</span> / <span class="count">8</span> 個網站</p>
  </div>

  <script>
    const sites = [
      'https://radi-ai-care.streamlit.app/',
      'https://gptgmail.onrender.com',
      'https://gptcalendar.onrender.com',
      'https://chat.openai.com',
      'https://claude.ai',
      'https://mail.google.com',
      'https://outlook.com',
      'https://linkedin.com'
    ];

    let opened = 0;
    const countEl = document.getElementById('count');

    // Open sites with slight delay to avoid popup blockers
    sites.forEach((url, index) => {
      setTimeout(() => {
        window.open(url, '_blank');
        opened++;
        countEl.textContent = opened;
      }, index * 300);
    });
  </script>
</body>
</html>
